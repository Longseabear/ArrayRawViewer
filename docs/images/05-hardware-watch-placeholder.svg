<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">하드웨어 픽셀 감시 화면 교체용 자리표시자</title>
  <desc id="desc">선택 픽셀, Watch 버튼, Visual Studio break 상태를 보이는 스크린샷 자리</desc>
  <rect width="1280" height="720" fill="#111c2d"/>
  <rect x="52" y="48" width="1176" height="624" rx="18" fill="#18283d" stroke="#4d6382" stroke-width="3"/>
  <text x="100" y="155" fill="#50ddc0" font-family="Segoe UI, Arial" font-size="36" font-weight="700">SCREENSHOT 05 · Hardware pixel watch</text>
  <text x="100" y="222" fill="#d7e5f8" font-family="Segoe UI, Arial" font-size="27">Replace with: a paused native debuggee, one selected pixel, and the Watch controls.</text>
  <rect x="104" y="316" width="776" height="240" rx="12" fill="#0d1624" stroke="#516e92" stroke-width="2"/>
  <rect x="131" y="348" width="82" height="82" fill="#214d5b"/><rect x="215" y="348" width="82" height="82" fill="#23511d"/><rect x="299" y="348" width="82" height="82" fill="#592121"/>
  <rect x="131" y="432" width="82" height="82" fill="#23511d"/><rect x="215" y="432" width="82" height="82" fill="#e56d2c" stroke="#ffe28b" stroke-width="4"/><rect x="299" y="432" width="82" height="82" fill="#592121"/>
  <text x="408" y="402" fill="#ffffff" font-family="Segoe UI, Arial" font-size="25">Selected pixel: x=500, y=500</text>
  <text x="408" y="450" fill="#b6c8dc" font-family="Segoe UI, Arial" font-size="23">Watch (Go to X, Y) · Watch Next X · Watch Next Y</text>
  <rect x="927" y="360" width="220" height="74" rx="8" fill="#49d2b4"/>
  <text x="963" y="407" fill="#062018" font-family="Segoe UI, Arial" font-size="26" font-weight="700">Watch + Run</text>
  <text x="100" y="620" fill="#f4c96b" font-family="Segoe UI, Arial" font-size="23">This is intentionally a placeholder. Replace this SVG with a real 16:9 capture using the same filename.</text>
</svg>
